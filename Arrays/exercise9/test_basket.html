<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Basket Test</title>
</head>
<body>

    <h2>Basket Testing</h2>

    <p>Product: <input type="text" id="product"></p>
    <p>Quantity: <input type="number" id="quantity"></p>
    <button onclick="addItem()">Add Item</button>

    <h3>Basket Items</h3>
    <p id="basketDisplay"></p>

    <h3>Enter Prices (JSON format)</h3>
    <textarea id="prices">{"apple": 1.5, "banana": 0.75, "orange": 1.2}</textarea>
    <br>
    <button onclick="calculateTotal()">Calculate Total</button>

    <h3>Total Cost: <span id="totalCost">$0.00</span></h3>

    <script>
        class Basket {
            constructor() {
                this.items = {};
            }

            addItem(product, qty) {
                if (!this.items[product]) {
                    this.items[product] = 0;
                }
                this.items[product] += qty;
            }

            getCost(prices) {
                let total = 0;
                for (let product in this.items) {
                    if (prices[product]) {
                        total += this.items[product] * prices[product];
                    }
                }
                return total;
            }
        }

        const myBasket = new Basket();

        function addItem() {
            let product = document.getElementById("product").value;
            let quantity = parseInt(document.getElementById("quantity").value);

            if (product && quantity > 0) {
                myBasket.addItem(product, quantity);
                displayBasket();
            }
        }

        function displayBasket() {
            let displayText = JSON.stringify(myBasket.items);
            document.getElementById("basketDisplay").innerText = displayText;
        }

        function calculateTotal() {
            let prices = JSON.parse(document.getElementById("prices").value);
            let total = myBasket.getCost(prices);
            document.getElementById("totalCost").innerText = "$" + total.toFixed(2);
        }
    </script>

</body>
</html>
